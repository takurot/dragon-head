[package]
name = "core-runtime"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Chrome/CDP session, Semantic Rendering Engine, policy engine, audit log, and privacy/security primitives for dragon-head"

[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror.workspace = true
tracing = { workspace = true }
headless_chrome = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
flatbuffers = "25"
uuid = { version = "1.0", features = ["v4"] }
json-patch = "4.1"
async-trait = "0.1"
crossbeam-channel = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regex = "1.12.3"
html-escape = "0.2"
unicode-normalization = "0.1"
url = "2.5"
aes-gcm = "0.10"
pbkdf2 = "0.12"
rand = "0.9"
hmac = "0.12"
zeroize = "1.8"
plugin-host = { path = "../plugin-host" }

[[example]]
name = "quickstart"
path = "../examples/quickstart.rs"

[[example]]
name = "policy_cookbook"
path = "../examples/policy_cookbook.rs"

[dev-dependencies]
urlencoding = "2.1"
image = { version = "0.25", default-features = false, features = ["png"] }
jsonschema = { workspace = true }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3.10"
test-bench-support = { path = "../test-bench-support" }
ed25519-dalek = { workspace = true }
wat = "1.240"
hex = { workspace = true }
