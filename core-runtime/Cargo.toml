[package]
name = "core-runtime"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Chrome/CDP session, Semantic Rendering Engine, policy engine, audit log, and privacy/security primitives for dragon-head"

# ISSUE-210: `PageSession::save_to_vault`/`load_from_vault` have no production caller (the
# `dragon-head-mcp` binary never calls them) — gate them behind an explicit opt-in feature so
# this doesn't ship as unused, untested-in-production public surface. The underlying
# `SessionVault`/`KmsAdapter` machinery stays ungated: every `BrowserClient` constructs a
# `LocalSessionVault` internally regardless (it's a required field, not optional overhead), so
# gating it would need a larger constructor refactor than this issue's scope warrants — see
# docs/session-vault.md for the full rationale and how to enable this for a real caller.
[features]
session-vault-api = []

[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror.workspace = true
tracing = { workspace = true }
headless_chrome = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
flatbuffers = "25"
uuid = { version = "1.0", features = ["v4"] }
json-patch = "4.1"
async-trait = "0.1"
crossbeam-channel = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regex = "1.12.3"
html-escape = "0.2"
unicode-normalization = "0.1"
url = "2.5"
aes-gcm = "0.10"
pbkdf2 = "0.12"
rand = "0.9"
hmac = "0.12"
zeroize = "1.8"
plugin-host = { path = "../plugin-host" }

[[example]]
name = "quickstart"
path = "../examples/quickstart.rs"

[[example]]
name = "policy_cookbook"
path = "../examples/policy_cookbook.rs"

[dev-dependencies]
# Self-dependency enabling `session-vault-api` for this crate's own tests only (ISSUE-210) — the
# documented Cargo idiom for a test-only feature: `cargo test -p core-runtime` exercises
# save_to_vault/load_from_vault, but the feature stays off for any real consumer (dragon-head-mcp
# included) unless explicitly requested.
core-runtime = { path = ".", features = ["session-vault-api"] }
urlencoding = "2.1"
image = { version = "0.25", default-features = false, features = ["png"] }
jsonschema = { workspace = true }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3.10"
test-bench-support = { path = "../test-bench-support" }
ed25519-dalek = { workspace = true }
wat = "1.240"
hex = { workspace = true }
tracing-subscriber = { workspace = true }
