[package]
name = "hitl-bridge"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Slack/Teams human-in-the-loop reference bridge for ask_human (HMAC-verified webhook server) for dragon-head"

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
core-runtime = { path = "../core-runtime" }
clap = { version = "4", features = ["derive", "env"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
hmac = "0.12"
sha2 = { workspace = true }
hex = { workspace = true }
serde_urlencoded = "0.7"
base64 = "0.22"

[[bin]]
name = "dragon-head-hitl-bridge"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.10"
test-bench-support = { path = "../test-bench-support" }
urlencoding = "2.1"
