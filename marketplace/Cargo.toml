[package]
name = "marketplace"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Domain-pack metadata, signature verification, and revenue-share primitives for dragon-head marketplace packs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
plugin-host = { path = "../plugin-host" }
skills-engine = { path = "../skills-engine" }
# Production code only verifies signatures (Signature, Verifier, VerifyingKey) —
# no signing/RNG needed, so the `rand_core` feature stays dev-only below where
# tests use `SigningKey::generate()`.
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand_core = { version = "0.6.4", features = ["getrandom", "std"] }
test-bench-support = { path = "../test-bench-support" }
