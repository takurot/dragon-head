[package]
name = "bench"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "NFR / ROI benchmarking harness and dashboard report generation for dragon-head (dragon-head-bench binary)"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
core-runtime = { path = "../core-runtime" }
mcp-server = { path = "../mcp-server" }
tempfile = "3.10"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lib]
name = "bench"
path = "src/lib.rs"

[[bin]]
name = "dragon-head-bench"
path = "src/main.rs"

[dev-dependencies]
test-bench-support = { path = "../test-bench-support" }
