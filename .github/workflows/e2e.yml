name: E2E Tests (Nightly)

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight
  workflow_dispatch:

jobs:
  ttft-bench-long:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run TTFT long benchmark gate
      env:
        TTFT_LONG_ITERATIONS: "400"
        TTFT_WARN_MS: "40"
        TTFT_FAIL_MS: "50"
      run: cargo test -p core-runtime --test async_pipeline test_async_pipeline_ttft_benchmark_long_gate -- --ignored --nocapture

  full-e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser
    - name: Run full e2e suite
      run: |
        echo "Running full E2E suite..."
    - name: Upload e2e failure artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-failures
        path: |
          *.png
          *.log
