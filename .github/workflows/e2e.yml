name: E2E Tests (Nightly)

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight
  workflow_dispatch:

jobs:
  nfr-benchmark-long:
    runs-on: ubuntu-latest
    env:
      CHROME_INSTALLED: "true"
      NFR_BENCH_MODE: "full"
      NFR_METRICS_DIR: "${{ github.workspace }}/core-runtime/target/nfr-metrics"
      NFR_DASHBOARD_PATH: "${{ github.workspace }}/core-runtime/target/nfr-dashboard.md"
      TTFT_LONG_ITERATIONS: "400"
      TTFT_WARN_MS: "40"
      TTFT_FAIL_MS: "50"
      NFR_LATENCY_TRIALS: "60"
      NFR_LATENCY_P95_LIMIT_MS: "100"
      NFR_LATENCY_P99_LIMIT_MS: "130"
      NFR_BANDWIDTH_TRIALS: "10"
      NFR_BANDWIDTH_REDUCTION_MIN_PERCENT: "95"
      NFR_CAPACITY_TRIALS: "4"
      NFR_CAPACITY_MINIMAL_SESSIONS: "75"
      NFR_CAPACITY_VISUAL_SESSIONS: "20"
      NFR_CAPACITY_MIN_SUCCESS_RATE_PERCENT: "100"
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser
    - name: Run TTFT long benchmark gate
      run: cargo test -p core-runtime --test async_pipeline test_async_pipeline_ttft_benchmark_long_gate -- --ignored
    - name: Run NFR latency benchmark (full)
      run: cargo test -p core-runtime --test nfr_latency --verbose
    - name: Run NFR bandwidth benchmark (full)
      run: cargo test -p core-runtime --test nfr_bandwidth --verbose
    - name: Run NFR capacity benchmark (full)
      run: cargo test -p core-runtime --test nfr_capacity --verbose
    - name: Generate NFR dashboard and enforce thresholds
      run: |
        python3 scripts/nfr_dashboard.py --metrics-dir "$NFR_METRICS_DIR" --output "$NFR_DASHBOARD_PATH"
        cat "$NFR_DASHBOARD_PATH" >> "$GITHUB_STEP_SUMMARY"
    - name: Upload NFR dashboard artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nfr-benchmark-long-dashboard
        path: |
          core-runtime/target/nfr-dashboard.md
          core-runtime/target/nfr-metrics/*.json

  full-e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser
    - name: Run full e2e suite
      env:
        CHROME_INSTALLED: "true"
      run: |
        cargo test -p core-runtime --test session_management --verbose
        cargo test -p core-runtime --test audit_logging --verbose
        cargo test -p core-runtime --test spa_stable_key_stress --verbose
    - name: Upload e2e failure artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-failures
        path: |
          *.png
          *.log

  evaluation-bench-full:
    runs-on: ubuntu-latest
    env:
      CHROME_INSTALLED: "true"
      DRAGON_HEAD_EVAL_MODE: "full"
      DRAGON_HEAD_EVAL_OUTPUT_DIR: "${{ github.workspace }}/target/evaluation-bench"
      DRAGON_HEAD_EVAL_DASHBOARD_PATH: "${{ github.workspace }}/target/evaluation-dashboard.md"
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser
    - name: Run core-runtime evaluation bench
      run: cargo test -p core-runtime --test comprehensive_evaluation -- --nocapture
    - name: Run mcp-server evaluation bench
      run: cargo test -p mcp-server --test comprehensive_evaluation -- --nocapture
    - name: Run skills-engine evaluation bench
      run: cargo test -p skills-engine --test comprehensive_evaluation --verbose
    - name: Run plugin-host evaluation bench
      run: cargo test -p plugin-host --test comprehensive_evaluation --verbose
    - name: Run marketplace evaluation bench
      run: cargo test -p marketplace --test comprehensive_evaluation --verbose
    - name: Generate evaluation dashboard
      run: |
        python3 scripts/evaluation_dashboard.py --input-dir "$DRAGON_HEAD_EVAL_OUTPUT_DIR" --output "$DRAGON_HEAD_EVAL_DASHBOARD_PATH"
        cat "$DRAGON_HEAD_EVAL_DASHBOARD_PATH" >> "$GITHUB_STEP_SUMMARY"
    - name: Upload evaluation bench artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: evaluation-bench-full
        path: |
          target/evaluation-dashboard.md
          target/evaluation-bench/*.json
