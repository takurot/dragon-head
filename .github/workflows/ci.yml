name: CI

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run fmt check
      run: cargo fmt --all -- --check
    - name: Run clippy
      run: cargo clippy --workspace -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install chromium
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser
    - name: Run tests
      env:
        CHROME_INSTALLED: "true"
      run: cargo test --workspace --verbose
    - name: Upload failure artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-failures
        path: |
          target/debug/deps/
          *.log

  ttft-bench-short:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run TTFT short benchmark gate
      env:
        TTFT_SHORT_ITERATIONS: "40"
        TTFT_WARN_MS: "35"
        TTFT_FAIL_MS: "50"
      run: cargo test -p core-runtime --test async_pipeline test_async_pipeline_ttft_benchmark_short_gate -- --nocapture

  smoke-e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser
    - name: Run semantic wait smoke test
      env:
        CHROME_INSTALLED: "true"
      run: cargo test -p core-runtime --test semantic_wait -- --nocapture
  cdp-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install chromium
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser
    - name: Run CDP smoke test
      # Retry to detect flakiness
      run: |
        cargo test --package core-runtime --lib -- --nocapture
        cargo test --package core-runtime --lib -- --nocapture

  sre-regression:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install chromium
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser
    - name: Run SRE determinism test
      env:
        CHROME_INSTALLED: "true"
      run: cargo test -p core-runtime --test sre_determinism --verbose
    - name: Run SRE profile filtering test
      env:
        CHROME_INSTALLED: "true"
      run: cargo test -p core-runtime --test sre_profile_filtering --verbose

  sre-semantic-delta:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run RFC 6902 semantic delta suite
      run: cargo test -p core-runtime --test sre_semantic_delta --verbose

  stable-key-compatibility:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run stable key compatibility vectors
      run: cargo test -p core-runtime --test stable_key_compatibility --verbose

  policy-regression:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install chromium
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser
    - name: Run policy engine and enforcement regression suite
      env:
        CHROME_INSTALLED: "true"
      run: |
        cargo test -p core-runtime --test policy_engine --verbose
        cargo test -p core-runtime --test policy_enforcement --verbose

  policy-schema-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run policy rules schema lint
      run: cargo test -p core-runtime --test policy_schema_lint --verbose

  som-regression:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install chromium
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser
    - name: Run SoM event-driven tests
      env:
        CHROME_INSTALLED: "true"
        SOM_ARTIFACT_DIR: "core-runtime/target/som-artifacts"
      run: |
        cargo test -p core-runtime --test som_event_driven --verbose
        cargo test -p core-runtime --test som_visual_diff --verbose
    - name: Upload SoM artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: som-regression-artifacts
        path: core-runtime/target/som-artifacts/*.png
