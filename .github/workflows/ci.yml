name: CI

on:
  push:
    branches: [ "main", "feature/**", "codex/**" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run fmt check
      run: cargo fmt --all -- --check
    - name: Run clippy
      run: cargo clippy --workspace -- -D warnings

  security-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # rustsec/audit-check downloads a pre-built binary — no source compile needed.
    # The job is informational (continue-on-error: true); the enforcing gate is
    # the cargo-deny job which uses deny.toml with explicit advisory ignores.
    - uses: rustsec/audit-check@v2
      continue-on-error: true
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # EmbarkStudios/cargo-deny-action downloads a pre-built binary.
    - uses: EmbarkStudios/cargo-deny-action@v2

  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install shellcheck
      run: sudo apt-get install -y shellcheck
    - name: Lint shell scripts
      shell: bash
      run: |
        mapfile -t scripts < <(find . -name "*.sh" -not -path "*/target/*" -not -path "*/.git/*")
        if [ "${#scripts[@]}" -eq 0 ]; then
          echo "No shell scripts found — nothing to check."
        else
          shellcheck "${scripts[@]}"
        fi

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify Chrome is available
      run: google-chrome --version
    - name: Run tests
      env:
        CHROME_INSTALLED: "true"
      run: cargo test --workspace --verbose
    - name: Upload failure artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-failures
        path: |
          target/debug/deps/
          *.log

  ttft-bench-short:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run TTFT short benchmark gate
      env:
        TTFT_SHORT_ITERATIONS: "40"
        TTFT_WARN_MS: "35"
        TTFT_FAIL_MS: "50"
      run: cargo test -p core-runtime --test async_pipeline test_async_pipeline_ttft_benchmark_short_gate -- --nocapture

  smoke-e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify Chrome is available
      run: google-chrome --version
    - name: Run semantic wait smoke test
      env:
        CHROME_INSTALLED: "true"
      run: |
        cargo test -p core-runtime --test semantic_wait -- --nocapture
        cargo test -p core-runtime --test session_management --verbose
        cargo test -p core-runtime --test audit_logging --verbose
        cargo test -p core-runtime --test spa_stable_key_stress --verbose
  cdp-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify Chrome is available
      run: google-chrome --version
    - name: Run CDP smoke test
      # Retry to detect flakiness
      run: |
        cargo test --package core-runtime --lib -- --nocapture
        cargo test --package core-runtime --lib -- --nocapture

  sre-regression:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify Chrome is available
      run: google-chrome --version
    - name: Run SRE determinism test
      env:
        CHROME_INSTALLED: "true"
      run: cargo test -p core-runtime --test sre_determinism --verbose
    - name: Run SRE snapshot regression test
      env:
        CHROME_INSTALLED: "true"
      run: cargo test -p core-runtime --test sre_snapshot_regression --verbose
    - name: Run SRE profile filtering test
      env:
        CHROME_INSTALLED: "true"
      run: cargo test -p core-runtime --test sre_profile_filtering --verbose

  sre-semantic-delta:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run RFC 6902 semantic delta suite
      run: cargo test -p core-runtime --test sre_semantic_delta --verbose

  stable-key-compatibility:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run stable key compatibility vectors
      run: cargo test -p core-runtime --test stable_key_compatibility --verbose

  policy-regression:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify Chrome is available
      run: google-chrome --version
    - name: Run policy engine and enforcement regression suite
      env:
        CHROME_INSTALLED: "true"
      run: |
        cargo test -p core-runtime --test policy_engine --verbose
        cargo test -p core-runtime --test policy_enforcement --verbose

  policy-schema-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run policy rules schema lint
      run: cargo test -p core-runtime --test policy_schema_lint --verbose

  som-regression:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify Chrome is available
      run: google-chrome --version
    - name: Run SoM event-driven tests
      env:
        CHROME_INSTALLED: "true"
        SOM_ARTIFACT_DIR: "core-runtime/target/som-artifacts"
      run: |
        cargo test -p core-runtime --test som_event_driven --verbose
        cargo test -p core-runtime --test som_visual_diff --verbose
    - name: Upload SoM artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: som-regression-artifacts
        path: core-runtime/target/som-artifacts/*.png

  skill-conformance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run skill conformance tests
      run: cargo test -p skills-engine --test skill_conformance --verbose

  skill-schema-compatibility:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run skill schema compatibility tests
      run: cargo test -p skills-engine --test skill_schema_compatibility --verbose

  plugin-signature-verification:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run plugin signature verification tests
      run: cargo test -p plugin-host --test plugin_signature_verification --verbose

  plugin-sbom-validation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run plugin SBOM validation tests
      run: cargo test -p plugin-host --test plugin_sbom_validation --verbose

  mcp-protocol-compliance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run MCP client contract and protocol compliance tests
      run: |
        cargo test -p mcp-server --test mcp_client_contract --verbose
        cargo test -p mcp-server --test mcp_protocol_compliance --verbose

  mcp-api-schema-diff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run MCP API schema diff snapshot check
      run: cargo test -p mcp-server --test mcp_schema_diff --verbose

  mcp-schema-compatibility:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run MCP semantic state schema compatibility tests
      run: cargo test -p mcp-server --test mcp_schema_compatibility --verbose

  metering-regression:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run metering and plan-gating regression tests
      run: cargo test -p mcp-server --test mcp_billing_plan_gating --verbose

  pricing-snapshot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run usage pricing snapshot diff check
      run: cargo test -p mcp-server --test mcp_pricing_snapshot --verbose

  nfr-benchmark-short:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CHROME_INSTALLED: "true"
      NFR_BENCH_MODE: "short"
      NFR_METRICS_DIR: "${{ github.workspace }}/core-runtime/target/nfr-metrics"
      NFR_DASHBOARD_PATH: "${{ github.workspace }}/core-runtime/target/nfr-dashboard.md"
      TTFT_SHORT_ITERATIONS: "40"
      TTFT_WARN_MS: "35"
      TTFT_FAIL_MS: "50"
      NFR_LATENCY_TRIALS: "20"
      NFR_LATENCY_P95_LIMIT_MS: "260"
      NFR_LATENCY_P99_LIMIT_MS: "340"
      NFR_BANDWIDTH_TRIALS: "5"
      NFR_BANDWIDTH_REDUCTION_MIN_PERCENT: "95"
      NFR_CAPACITY_TRIALS: "2"
      NFR_CAPACITY_MINIMAL_SESSIONS: "25"
      NFR_CAPACITY_VISUAL_SESSIONS: "8"
      NFR_CAPACITY_MIN_SUCCESS_RATE_PERCENT: "100"
    steps:
    - uses: actions/checkout@v4
    - name: Verify Chrome is available
      run: google-chrome --version
    - name: Run TTFT short benchmark
      run: cargo test -p core-runtime --test async_pipeline test_async_pipeline_ttft_benchmark_short_gate
    - name: Run NFR Latency Benchmark
      run: cargo test -p core-runtime --test nfr_latency --verbose
    - name: Run NFR Bandwidth Verification
      run: cargo test -p core-runtime --test nfr_bandwidth --verbose
    - name: Run NFR Capacity Simulation
      run: cargo test -p core-runtime --test nfr_capacity --verbose
    - name: Generate NFR dashboard and enforce thresholds
      run: |
        python3 scripts/nfr_dashboard.py --metrics-dir "$NFR_METRICS_DIR" --output "$NFR_DASHBOARD_PATH"
        cat "$NFR_DASHBOARD_PATH" >> "$GITHUB_STEP_SUMMARY"
    - name: Upload NFR dashboard artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nfr-benchmark-short-dashboard
        path: |
          core-runtime/target/nfr-dashboard.md
          core-runtime/target/nfr-metrics/*.json

  evaluation-bench-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CHROME_INSTALLED: "true"
      DRAGON_HEAD_EVAL_MODE: "smoke"
      DRAGON_HEAD_EVAL_OUTPUT_DIR: "${{ github.workspace }}/target/evaluation-bench"
      DRAGON_HEAD_EVAL_DASHBOARD_PATH: "${{ github.workspace }}/target/evaluation-dashboard.md"
    steps:
    - uses: actions/checkout@v4
    - name: Verify Chrome is available
      run: google-chrome --version
    - name: Run core-runtime evaluation bench
      run: cargo test -p core-runtime --test comprehensive_evaluation -- --nocapture
    - name: Run mcp-server evaluation bench
      run: cargo test -p mcp-server --test comprehensive_evaluation -- --nocapture
    - name: Run skills-engine evaluation bench
      run: cargo test -p skills-engine --test comprehensive_evaluation --verbose
    - name: Run plugin-host evaluation bench
      run: cargo test -p plugin-host --test comprehensive_evaluation --verbose
    - name: Run marketplace evaluation bench
      run: cargo test -p marketplace --test comprehensive_evaluation --verbose
    - name: Generate evaluation dashboard
      run: |
        python3 scripts/evaluation_dashboard.py --input-dir "$DRAGON_HEAD_EVAL_OUTPUT_DIR" --output "$DRAGON_HEAD_EVAL_DASHBOARD_PATH"
        cat "$DRAGON_HEAD_EVAL_DASHBOARD_PATH" >> "$GITHUB_STEP_SUMMARY"
    - name: Upload evaluation bench artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: evaluation-bench-smoke
        path: |
          target/evaluation-dashboard.md
          target/evaluation-bench/*.json
