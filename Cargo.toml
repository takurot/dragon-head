[workspace]
members = [
    "core-runtime",
    "mcp-server",
    "plugin-host",
    "skills-engine",
    "marketplace",
    "test-bench-support",
    "bench",
    "hitl-bridge",
]
resolver = "2"

[workspace.package]
license = "MIT"
repository = "https://github.com/takurot/dragon-head"

[workspace.dependencies]
tokio = { version = "1.36", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
headless_chrome = "=1.0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[profile.test]
# Keep the default workspace test and compile-only verification paths stable across developer filesystems.
incremental = false
opt-level = 2
