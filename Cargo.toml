[workspace]
members = [
    "core-runtime",
    "mcp-server",
    "plugin-host",
    "skills-engine",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.36", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
headless_chrome = "1.0"  # Specific version to be checked
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
